model:
  name: wan_fasterwam
  running_dtype: bf16
  model_path: /mnt/miaohua/charles/models/Wan2.2-TI2V-5B
  checkpoint_path: /mnt/miaohua/charles/models/fasterwam_release/robotwin/step_029355.pt
  proprio_dim: 14
  mot_checkpoint_mixed_attn: true
  condition_layers:
  - 0
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 28
  video_kv_fusion: interval_weighted_sum
  video_kv_fusion_init: current_layer
  redirect_common_files: false
  action_dit_config:
    action_dim: 14
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    noncondition_num_heads: 8
    condition_layers: [0, 4, 8, 12, 16, 20, 24, 28]
    use_gradient_checkpointing: true
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: true
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: 14
    action_group_causal_mask_mode: group_diagonal
data:
  train:
    name: robotwin_fastwam_dataset
    dataset_dirs: &id001
    - /mnt/miaohua/charles/datasets/FastWAM-RoboTwin/robotwin2.0
    shape_meta: &id002
      images:
      - key: cam_high
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      - key: cam_left_wrist
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      - key: cam_right_wrist
        raw_shape:
        - 3
        - 480
        - 640
        shape:
        - 3
        - 240
        - 320
      action:
      - key: default
        raw_shape: 14
        shape: 14
      state:
      - key: default
        raw_shape: 14
        shape: 14
    image_size: &id003
    - 240
    - 320
    video_size: &id004
    - 384
    - 320
    num_frames: 33
    action_video_freq_ratio: 4
    observation_only_video: false
    val_set_proportion: 0.01
    pretrained_norm_stats: /mnt/miaohua/charles/datasets/FastWAM-RoboTwin/dataset_stats.json
    text_embedding_cache_dir: /mnt/miaohua/charles/codes/LightX2V_fastwam/lightx2v_train/runs/fastwam_robotwin_action_1step_dmd_lora_only-v3/text_embeds_cache
    batch_size: 16
    num_workers: 8
  val:
    name: robotwin_fastwam_dataset
    dataset_dirs: *id001
    shape_meta: *id002
    image_size: *id003
    video_size: *id004
    num_frames: 33
    action_video_freq_ratio: 4
    observation_only_video: false
    val_set_proportion: 0.01
    pretrained_norm_stats: /mnt/miaohua/charles/datasets/FastWAM-RoboTwin/dataset_stats.json
    text_embedding_cache_dir: /mnt/miaohua/charles/codes/LightX2V_fastwam/lightx2v_train/runs/fastwam_robotwin_action_1step_dmd_lora_only-v3/text_embeds_cache
    batch_size: 4
    num_workers: 8
    is_training_set: false
training:
  method: fasterwam_action_consistency
  output_dir: runs/fastwam_robotwin_action_1step_consistency_ts10
  max_train_iters: 30000
  gradient_accumulation_iters: 1
  gradient_checkpointing: false
  max_grad_norm: 1.0
  save_every_iters: 2000
  save_total_limit: 3
  save_final: true
  lr_scheduler: cosine
  lr_warmup_iters: 500
  student:
    train_type: lora
    lora:
      rank: 128
      alpha: 128
      dropout: 0.0
      target_modules:
      - q
      - k
      - v
      - o
      - ffn.0
      - ffn.2
      modules_to_save: []
    optimizer:
      learning_rate: 0.0001
      weight_decay: 0.01
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_epsilon: 1.0e-08
  action_consistency:
    flow_target: data
    target_steps: 10
    teacher_reference_steps: 10
    ema_decay: 0.995
    consistency_loss_weight: 1.0
    flow_loss_weight: 0.0
    huber_c: 0.001
inference:
  infer_every_iters: 500
  num_samples: 4
  seed: 42
logging:
  train_log_every_iters: 10
  wandb:
    enable: true
    project: fastwam-action-consistency
    name: robotwin-action-1step-consistency-ts10
    group: robotwin-action-1step-consistency
    job_type: train
    tags:
    - fastwam
    - robotwin
    - action-consistency
    - 1step
    - lora-only
    - 30k
resume:
  auto_resume: false
  resume_ckpt_path: null
distributed:
  backend: nccl
  zero1:
    enabled: false
  sequence_parallel:
    enabled: false
