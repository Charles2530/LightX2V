model:
  name: wan_fastwam
  running_dtype: bf16
  model_path: /mnt/afs_1/charles/models/Wan2.2-TI2V-5B
  checkpoint_path: /mnt/afs_1/charles/models/fastwam/robotwin_uncond_3cam_384.pt
  proprio_dim: 14
  mot_checkpoint_mixed_attn: false
  action_dit_config:
    action_dim: 14
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-6

data:
  train: &robotwin_data
    name: robotwin_fastwam_dataset
    # The archive directory contains the extracted LeRobot root one level
    # below it; this is the directory that has meta/info.json.
    dataset_dirs:
      - /mnt/afs_1/charles/codes/LightX2V_fastwam/datasets/fastwam/robotwin2.0/robotwin2.0
    shape_meta:
      images:
        - key: cam_high
          raw_shape: [3, 480, 640]
          shape: [3, 240, 320]
        - key: cam_left_wrist
          raw_shape: [3, 480, 640]
          shape: [3, 240, 320]
        - key: cam_right_wrist
          raw_shape: [3, 480, 640]
          shape: [3, 240, 320]
      action:
        - key: default
          raw_shape: 14
          shape: 14
      state:
        - key: default
          raw_shape: 14
          shape: 14
    image_size: [240, 320]
    video_size: [384, 320]
    num_frames: 33
    action_video_freq_ratio: 4
    observation_only_video: true
    val_set_proportion: 0.01
    pretrained_norm_stats: /mnt/afs_1/charles/codes/LightX2V_fastwam/datasets/fastwam/robotwin2.0/dataset_stats.json
    text_embedding_cache_dir: /mnt/afs_1/charles/codes/LightX2V_fastwam/lightx2v_train/runs/fastwam_robotwin_assets/text_embeds_cache
    batch_size: 16
    num_workers: 8
  val:
    <<: *robotwin_data
    batch_size: 4
    is_training_set: false

training:
  method: fastwam_action_dmd
  output_dir: runs/fastwam_robotwin_action_1step_dmd_lora_only
  max_train_iters: 30000
  gradient_accumulation_iters: 1
  gradient_checkpointing: false
  max_grad_norm: 1.0
  save_every_iters: 2000
  save_total_limit: 3
  save_final: true
  lr_scheduler: cosine
  lr_warmup_iters: 500
  student:
    train_type: lora
    lora:
      rank: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q, k, v, o, ffn.0, ffn.2]
      modules_to_save: []
    optimizer:
      learning_rate: 1.0e-4
      weight_decay: 1.0e-2
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_epsilon: 1.0e-8
  fake:
    train_type: lora
    lora:
      rank: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q, k, v, o, ffn.0, ffn.2]
      modules_to_save: []
    optimizer:
      learning_rate: 1.0e-4
      weight_decay: 1.0e-2
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_epsilon: 1.0e-8
  action_dmd:
    generator_steps: 1
    teacher_steps: 20
    endpoint_warmup_iters: 1000
    endpoint_loss_weight: 0.0
    dmd_loss_weight: 1.0
    fake_loss_weight: 1.0
    fake_update_ratio: 1
    sigma_min: 0.02
    sigma_max: 0.98
    norm_clip_min: 0.01

inference:
  infer_every_iters: 500
  num_samples: 4
  seed: 42

logging:
  train_log_every_iters: 10
  wandb:
    enable: true
    project: fastwam-action-dmd
    name: robotwin-action-1step-dmd-lora-only
    group: robotwin-action-1step-dmd
    job_type: train
    tags: [fastwam, robotwin, action-dmd, endpoint-to-dmd, 1step, pure-lora, lora-only, 30k]

resume:
  auto_resume: false
  resume_ckpt_path: null

distributed:
  backend: nccl
  zero1:
    enabled: false
  sequence_parallel:
    enabled: false
