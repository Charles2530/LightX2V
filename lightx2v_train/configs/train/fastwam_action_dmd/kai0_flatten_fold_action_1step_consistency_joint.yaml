model:
  name: wan_fastwam
  running_dtype: bf16
  model_path: ${oc.env:WAN_MODEL_PATH,/mnt/miaohua/charles/models/Wan2.2-TI2V-5B}
  checkpoint_path: ${oc.env:TEACHER_CHECKPOINT}
  proprio_dim: 14
  action_dit_config:
    action_dim: 14

data:
  train: &kai0_data
    name: kai0_fastwam_dataset
    dataset_dirs:
      - ${oc.env:KAI0_DATASET_DIR,/mnt/miaohua/charles/datasets/Kai0/Task_A/base}
    shape_meta:
      images: [top_head, hand_left, hand_right]
      action: [{key: default, raw_shape: 14, shape: 14}]
      state: [{key: default, raw_shape: 14, shape: 14}]
    image_size: [224, 224]
    delta_action_dim_mask: [false, false, false, false, false, false, false, false, false, false, false, false, false, false]
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    context_len: 128
    # Use the exact normalization and prompts from teacher training.
    pretrained_norm_stats: ${oc.env:TEACHER_RUN_DIR,runs/fastwam_kai0_flatten_fold}/dataset_stats.json
    text_embedding_cache_dir: ${oc.env:TEACHER_RUN_DIR,runs/fastwam_kai0_flatten_fold}/text_embeds_cache
    observation_only_video: true
    val_set_proportion: 0.01
    batch_size: 4
    num_workers: 8
  val:
    <<: *kai0_data
    batch_size: 2

training:
  method: fastwam_joint_consistency
  train_video: true
  output_dir: ${oc.env:OUTPUT_DIR,runs/fastwam_kai0_flatten_fold_action_1step_consistency_joint}
  max_train_iters: 30000
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  save_every_iters: 5000
  save_total_limit: 5
  save_final: true
  lr_scheduler: cosine
  lr_warmup_iters: 500
  student:
    train_type: lora
    lora:
      rank: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q, k, v, o, ffn.0, ffn.2]
      modules_to_save: []
    optimizer:
      learning_rate: 1.0e-4
      weight_decay: 1.0e-2
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_epsilon: 1.0e-8
  action_consistency:
    target_steps: 10
    teacher_reference_steps: 10
    ema_decay: 0.995
    consistency_loss_weight: 1.0
    flow_loss_weight: 0.2
    huber_c: 0.001

inference:
  infer_every_iters: 500
  num_samples: 16
  seed: 42

logging:
  train_log_every_iters: 10

resume:
  auto_resume: false
  resume_ckpt_path: null

distributed:
  backend: nccl
  zero1:
    enabled: false
  sequence_parallel:
    enabled: false
